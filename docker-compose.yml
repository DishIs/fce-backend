services:
  nginx:
    image: nginx:1.22-alpine
    container_name: maildrop-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
    command: >
      /bin/sh -c "
        echo 'Waiting for mcp-server to be ready...'
        nginx -t && nginx -g 'daemon off;'
      "

  certbot:
    image: certbot/certbot
    profiles: [ "manual" ]
    container_name: certbot
    volumes:
      - certs:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
      - ./smtp-fast/src/config:/haraka-config
    entrypoint: /bin/sh -c
    command: >
      "certbot certonly --webroot --webroot-path=/var/www/certbot --email dishantsinghdev@icloud.com --agree-tos --no-eff-email --key-type ecdsa --elliptic-curve secp384r1 -d api2.freecustom.email -d mx.freecustom.email -d mcp.freecustom.email && echo 'Copying initial certs to Haraka config...' && cp /etc/letsencrypt/live/api2.freecustom.email/privkey.pem /haraka-config/tls_key.pem && cp /etc/letsencrypt/live/api2.freecustom.email/fullchain.pem /haraka-config/tls_cert.pem"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: fce-mcp-server
    restart: unless-stopped
    environment:
      - TRANSPORT=sse
      - PORT=3001
      - FCE_API_URL=${FCE_API_URL:-https://api2.freecustom.email/v1/mcp}
      - MCP_BASE_URL=${MCP_BASE_URL:-https://mcp.freecustom.email}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  certbot-renew:
    image: certbot/certbot
    volumes:
      - certs:/etc/letsencrypt
      - ./certbot-webroot:/var/www/certbot
      - ./smtp-fast/src/config:/haraka-config
    entrypoint: >
      sh -c "
        while :; do
          certbot renew --quiet &&
          echo 'Copying renewed certs to Haraka config...' &&
          cp /etc/letsencrypt/live/api2.freecustom.email/privkey.pem /haraka-config/tls_key.pem &&
          cp /etc/letsencrypt/live/api2.freecustom.email/fullchain.pem /haraka-config/tls_cert.pem &&
          pkill -HUP haraka;
          sleep 12h;
        done
      "
    depends_on:
      - nginx
      - haraka
    restart: unless-stopped

  api:
    build:
      context: ./api-gateway
    container_name: maildrop-api
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      FREE_CLUSTER_URL: http://api-free:3000
      PRO_CLUSTER_URL: http://api-pro:3000
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - api-free
      - api-pro

  api-free:
    build:
      context: ./api
    container_name: maildrop-api-free
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MARKETPLACE_SECRET: ${MARKETPLACE_SECRET}
      APP_URL: https://www.freecustom.email
      PADDLE_PRICE_DEVELOPER: ${PADDLE_PRICE_DEVELOPER}
      PADDLE_PRICE_DEVELOPER_YEARLY: ${PADDLE_PRICE_DEVELOPER_YEARLY}
      PADDLE_PRICE_STARTUP: ${PADDLE_PRICE_STARTUP}
      PADDLE_PRICE_STARTUP_YEARLY: ${PADDLE_PRICE_STARTUP_YEARLY}
      PADDLE_PRICE_GROWTH: ${PADDLE_PRICE_GROWTH}
      PADDLE_PRICE_GROWTH_YEARLY: ${PADDLE_PRICE_GROWTH_YEARLY}
      PADDLE_PRICE_ENTERPRISE: ${PADDLE_PRICE_ENTERPRISE}
      PADDLE_PRICE_ENTERPRISE_YEARLY: ${PADDLE_PRICE_ENTERPRISE_YEARLY}
      PADDLE_ENV: production
      PADDLE_API_KEY: ${PADDLE_API_KEY}
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          memory: 256M
    restart: unless-stopped

  api-pro:
    build:
      context: ./api
    container_name: maildrop-api-pro
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MARKETPLACE_SECRET: ${MARKETPLACE_SECRET}
      APP_URL: https://www.freecustom.email
      PADDLE_PRICE_DEVELOPER: ${PADDLE_PRICE_DEVELOPER}
      PADDLE_PRICE_DEVELOPER_YEARLY: ${PADDLE_PRICE_DEVELOPER_YEARLY}
      PADDLE_PRICE_STARTUP: ${PADDLE_PRICE_STARTUP}
      PADDLE_PRICE_STARTUP_YEARLY: ${PADDLE_PRICE_STARTUP_YEARLY}
      PADDLE_PRICE_GROWTH: ${PADDLE_PRICE_GROWTH}
      PADDLE_PRICE_GROWTH_YEARLY: ${PADDLE_PRICE_GROWTH_YEARLY}
      PADDLE_PRICE_ENTERPRISE: ${PADDLE_PRICE_ENTERPRISE}
      PADDLE_PRICE_ENTERPRISE_YEARLY: ${PADDLE_PRICE_ENTERPRISE_YEARLY}
      PADDLE_ENV: production
      PADDLE_API_KEY: ${PADDLE_API_KEY}
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "2.50"
          memory: 2560M
        reservations:
          memory: 1024M
    restart: unless-stopped

  cleanup:
    build:
      context: ./api
    container_name: maildrop-cleanup
    command: >
      sh -c "
        echo 'Cleanup worker started';
        while true; do
          node dist/workers/cleanup-job.js;
          echo 'Cleanup finished. Sleeping 24h...';
          sleep 86400;
        done
      "
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
    depends_on:
      - mongo
    restart: unless-stopped

  domain-verifier:
    build:
      context: ./api
    container_name: maildrop-domain-verifier
    command: >
      sh -c "
        echo 'Domain verifier worker started';
        node dist/workers/domain-verifier.js;
      "
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VERIFY_INTERVAL_MS: 21600000
      FAILURE_THRESHOLD: 2
      OUR_MX_SUFFIX: mx.freecustom.email
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: https://www.freecustom.email
      MAIL_DISABLED: "true"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  redis-cleanup:
    build:
      context: ./api
    container_name: maildrop-redis-cleanup
    command: >
      sh -c "
        echo 'Redis cleanup worker started';
        node dist/workers/redis-cleanup.js;
      "
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_CLEANUP_INTERVAL_MS: 21600000
    depends_on:
      - redis
    restart: unless-stopped

  deletion-worker:
    build:
      context: ./api
    container_name: maildrop-deletion-worker
    command: node dist/workers/deletion-worker.js
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      DELETION_WORKER_INTERVAL_MS: 3600000
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: https://www.freecustom.email
    depends_on:
      - mongo
    restart: unless-stopped

  subscription-expiry:
    build:
      context: ./api
    container_name: maildrop-subscription-expiry
    command: >
      sh -c "
        echo 'Subscription expiry worker started';
        node dist/workers/subscription-expiry.js;
      "
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EXPIRY_INTERVAL_MS: 21600000
      FREE_MAILBOX_SIZE: 20
      FREE_MAILBOX_TTL: 86400
      PLAN_CACHE_TTL: 3600
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: https://www.freecustom.email
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  trial-reminder:
    build:
      context: ./api
    container_name: maildrop-trial-reminder
    command: >
      sh -c "
        echo 'Trial reminder worker started';
        node dist/workers/trial-reminder.js;
      "
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: https://www.freecustom.email
      TRIAL_REMINDER_INTERVAL_MS: 900000
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  haraka:
    build:
      context: ./smtp-fast
    container_name: maildrop-smtp
    ports:
      - "25:25"
      - "587:587"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/freecustomemail?authSource=admin
    volumes:
      - ./smtp-fast/src/config:/smtp-fast/src/config
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    command: [ "redis-server", "--bind", "0.0.0.0", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - maildrop_redis_data:/data

  mongo:
    image: mongo:7
    container_name: mongo_server
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: freecustomemail
    ports:
      - "27017:27017"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - maildrop_mongo_data:/data/db

volumes:
  maildrop_mongo_data:
  maildrop_redis_data:
  certs: